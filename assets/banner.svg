h4.16l2.09 16h-2.65l-.36-3.67h-2.32zm.95-9.47-.35 3.52h1.84l-.35-3.52-.29-4.25h-.56m10.15 13.72h-3.38v-16h3.37q2.02 0 2.95.83t.94 2.74v.84q0 .39-.02.76-.06 1.02-.445 1.625t-1.205.875v.46q.85.27 1.24.88t.43 1.67q.02.47.02.87t-.02.88q-.08 1.9-.97 2.735t-2.91.835m-.79-6.98v4.7h.79q.63 0 .965-.335t.335-.985q.01-.42.01-.805t-.01-.795q0-.97-.315-1.375t-1.005-.405zm0-6.74v4.46h.78q.64 0 .97-.42t.34-1.22v-1.66q-.01-.57-.34-.865t-.97-.295m8.44 13.72h-2.65l2.09-16h4.16l2.09 16h-2.65l-.36-3.67h-2.32zm.95-9.47-.35 3.52h1.84l-.35-3.52-.29-4.25h-.56m9.27 13.72h-2.5v-16h3.82l1.13 5.09 1.16 8.63h.5l-.47-7.16-.21-6.56h2.5v16h-4l-1.15-5.36-.9-8.38h-.54l.44 7.64m11.13 6.1h-2.65l2.09-16h4.16l2.09 16h-2.65l-.36-3.67h-2.32zm.95-9.47-.35 3.52h1.84l-.35-3.52-.29-4.25h-.56m9.94 13.9q-1.33 0-2.11-.37t-1.13-1.18-.38-2.12q-.01-.57-.01-1.225t.01-1.235h2.43q-.01.41-.015.94t0 1.055.015.935q.02.54.305.815t.885.275q.61 0 .875-.275t.265-.815V4.321h2.58v12.51q0 1.97-.835 2.82t-2.885.85"/></g>
  </g>

  <text class="mono rise r2" x="64" y="186" font-size="18" letter-spacing="5" fill="#ede8df">SOFTWARE ENGINEER</text>
  <rect class="rise r2" x="64" y="198" width="36" height="2" fill="#ff4f00"/>
  <text class="sans rise r3" x="64" y="232" font-size="16" fill="#8f8a80">Uniting rigorous engineering and AI to build exceptional systems.</text>

  <g class="mono rise r4" font-size="11.5" letter-spacing="1.5">
    <rect x="64.5" y="262.5" width="118" height="30" fill="#151412" stroke="#2a2824"/>
    <rect x="76" y="274" width="7" height="7" fill="#ff4f00"/>
    <text x="92" y="282" fill="#ede8df">4.0 GPA</text>

    <rect x="192.5" y="262.5" width="178" height="30" fill="#151412" stroke="#2a2824"/>
    <rect x="204" y="274" width="7" height="7" fill="#ff4f00"/>
    <text x="220" y="282" fill="#ede8df">RANK #1 · EPOKA</text>

    <rect x="380.5" y="262.5" width="226" height="30" fill="#151412" stroke="#2a2824"/>
    <rect x="392" y="274" width="7" height="7" fill="#ff4f00"/>
    <text x="408" y="282" fill="#ede8df">PM'S GOLD MEDAL 2023</text>
  </g>

  <!-- Right: the Instrument, exploded into five layers (drawn bottom-up) -->
  <g transform="translate(0 0)">
    <!-- centreline -->
    <path d="M840 22V318" stroke="#8f8a80" stroke-opacity=".35" stroke-dasharray="10 4 2 4"/>

    <g class="p p5"><g transform="translate(740 134)"><use href="#plate"/>
      <g class="lbl"><path d="M200 32H258" stroke="#8f8a80" stroke-width="1"/><circle cx="200" cy="32" r="2.5" fill="#8f8a80"/>
      <text class="mono" x="266" y="36" font-size="11.5" letter-spacing="2" fill="#ede8df"><tspan fill="#8f8a80">05 ─ </tspan>INFRASTRUCTURE</text></g></g></g>

    <g class="p p4"><g transform="translate(740 134)"><use href="#plate"/>
      <g class="lbl"><path d="M200 32H258" stroke="#8f8a80" stroke-width="1"/><circle cx="200" cy="32" r="2.5" fill="#8f8a80"/>
      <text class="mono" x="266" y="36" font-size="11.5" letter-spacing="2" fill="#ede8df"><tspan fill="#8f8a80">04 ─ </tspan>DATA</text></g></g></g>

    <g class="p p3"><g transform="translate(740 134)"><use href="#plate"/>
      <g class="lbl"><path d="M200 32H258" stroke="#8f8a80" stroke-width="1"/><circle cx="200" cy="32" r="2.5" fill="#8f8a80"/>
      <text class="mono" x="266" y="36" font-size="11.5" letter-spacing="2" fill="#ede8df"><tspan fill="#8f8a80">03 ─ </tspan>SERVICES</text></g></g></g>

    <g class="p p2"><g transform="translate(740 134)"><use href="#plate"/>
      <g class="lbl"><path d="M200 32H258" stroke="#8f8a80" stroke-width="1"/><circle cx="200" cy="32" r="2.5" fill="#8f8a80"/>
      <text class="mono" x="266" y="36" font-size="11.5" letter-spacing="2" fill="#ede8df"><tspan fill="#8f8a80">02 ─ </tspan>API</text></g></g></g>

    <g class="p p1"><g transform="translate(740 134)"><use href="#plate"/>
      <path d="M100 18 144 32 100 46 56 32Z" fill="none" stroke="#ff4f00" stroke-width="1.2"/>
      <path d="M100 28 112 32 100 36 88 32Z" fill="#ff4f00"/>
      <g class="lbl"><path d="M200 32H258" stroke="#ff4f00" stroke-width="1"/><circle cx="200" cy="32" r="2.5" fill="#ff4f00"/>
      <text class="mono" x="266" y="36" font-size="11.5" letter-spacing="2" fill="#ede8df"><tspan fill="#ff4f00">01 ─ </tspan>INTERFACE</text></g></g></g>

