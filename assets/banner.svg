<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Shpëtim Shabanaj — Software Engineer</title>
  <desc id="d">The Sh² logo and the name Shpëtim Shabanaj, Software Engineer in Tiranë, Albania, beside an exploded view of five stacked layers: Interface, API, Services, Data and Infrastructure.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a1916" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#24221e" stroke-width="1"/>
    </pattern>
    <g id="plate">
      <path d="M0 32 100 0 200 32 100 64Z" fill="#151412" stroke="#8f8a80" stroke-opacity=".55" stroke-width="1"/>
      <path d="M0 32 100 64V72L0 40Z" fill="#0f0e0c" stroke="#8f8a80" stroke-opacity=".35" stroke-width="1"/>
      <path d="M100 64 200 32V40L100 72Z" fill="#1e1c19" stroke="#8f8a80" stroke-opacity=".35" stroke-width="1"/>
    </g>
  </defs>
  <style>
    .mono { font-family: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* Logo: the mark draws on, the exponent lights up like an LED, the wordmark slides in. */
    .ink { fill: #ede8df; fill-opacity: 1; stroke: #ede8df; stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .led { fill: #ff4f00; }
    .word { fill: #ede8df; }
    .rise { opacity: 1; }

    /* Exploded view: default (and reduced-motion) state is fully exploded with labels visible. */
    .p { transform-box: view-box; }
    .p1 { transform: translateY(-104px); } .p2 { transform: translateY(-52px); } .p3 { transform: translateY(0); }
    .p4 { transform: translateY(52px); } .p5 { transform: translateY(104px); }
    .lbl { opacity: 1; }
    .scan { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .ink { animation: draw 1.6s cubic-bezier(.65,0,.35,1) both, fillin .5s ease-out 1.3s both; }
      .led { animation: led 1.2s steps(1, end) 1.4s both; }
      .word { animation: slide .9s cubic-bezier(.16,1,.3,1) .9s both; }
      .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
      .r1 { animation-delay: 1.2s; } .r2 { animation-delay: 1.35s; } .r3 { animation-delay: 1.5s; } .r4 { animation-delay: 1.65s; }

      .p1 { animation: e1 9s cubic-bezier(.65,0,.35,1) infinite; }
      .p2 { animation: e2 9s cubic-bezier(.65,0,.35,1) infinite; }
      .p3 { animation: e3 9s cubic-bezier(.65,0,.35,1) infinite; }
      .p4 { animation: e4 9s cubic-bezier(.65,0,.35,1) infinite; }
      .p5 { animation: e5 9s cubic-bezier(.65,0,.35,1) infinite; }
      .lbl { animation: lbl 9s ease-in-out infinite; }
      .scan { animation: scan 9s linear infinite; }
    }

    @keyframes draw { from { stroke-dashoffset: 1; fill-opacity: 0; } to { stroke-dashoffset: 0; fill-opacity: 0; } }
    @keyframes fillin { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes led { 0% { opacity: 0; } 15% { opacity: 1; } 25% { opacity: .2; } 35% { opacity: 1; } 45% { opacity: .4; } 55%, 100% { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @keyframes e1 { 0%, 10% { transform: translateY(-20px); } 30%, 78% { transform: translateY(-104px); } 96%, 100% { transform: translateY(-20px); } }
    @keyframes e2 { 0%, 10% { transform: translateY(-10px); } 30%, 78% { transform: translateY(-52px); }  96%, 100% { transform: translateY(-10px); } }
    @keyframes e3 { 0%, 100% { transform: translateY(0); } }
    @keyframes e4 { 0%, 10% { transform: translateY(10px); }  30%, 78% { transform: translateY(52px); }   96%, 100% { transform: translateY(10px); } }
    @keyframes e5 { 0%, 10% { transform: translateY(20px); }  30%, 78% { transform: translateY(104px); }  96%, 100% { transform: translateY(20px); } }
    @keyframes lbl { 0%, 24% { opacity: 0; } 34%, 74% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @keyframes scan { 0%, 34% { opacity: 0; transform: translateY(-120px); } 38% { opacity: .9; } 70% { opacity: .9; } 74%, 100% { opacity: 0; transform: translateY(120px); } }
  </style>

  <!-- Drawing sheet -->
  <rect width="1200" height="340" fill="#0b0a08"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#gridMajor)"/>
  <rect x="12.5" y="12.5" width="1175" height="315" fill="none" stroke="#2a2824" stroke-width="1"/>
  <g stroke="#8f8a80" stroke-width="1" fill="none">
    <path d="M24 36V24H36M1164 24H1176V36M1176 304V316H1164M36 316H24V304"/>
  </g>

  <!-- Left: logo, role, proof points -->
  <text class="mono rise r1" x="64" y="66" font-size="11" letter-spacing="2.5" fill="#8f8a80">// SHPETIMSHABANAJ.COM · TIRANË, ALBANIA</text>

  <g transform="translate(64 88) scale(2.6)">
    <path class="ink" pathLength="1" vector-effect="non-scaling-stroke" d="M12.6 9.333a5.6 5.6 0 1 0-5.6 5.6h3.267v5.134H0V22.4h12.6v-9.8H7a3.267 3.267 0 1 1 3.267-3.267ZM14 0v22.4h2.333V9.333h6.534V22.4H25.2V7h-8.867V0Z"/>
    <path class="led" d="M28.5 0v3.5H32V0Z" transform="scale(.93333)"/>
